onboarding = false

[theme]
name = "one-dark"

[theme.custom]
sidebar_bg = "#1b1c1e"

[terminal]
default_shell = "/bin/bash"

[advanced]
scrollback_limit_bytes = 50000000

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true
pane_gaps = false
tab_bar_right = [
  { type = "hostname" },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " · "

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "machine", "workspace", "tab"],
  ["agent", { token = "$cache", rules = [
    # Gradient from the default gray (fresh cache, empty circle) to blue (about to expire, full circle), interpolated in
    # OKLab with an ease-in curve
    { equals = "󰝦", fg = "#737a87" },
    { equals = "󰪞", fg = "#737b88" },
    { equals = "󰪟", fg = "#727d8d" },
    { equals = "󰪠", fg = "#718094" },
    { equals = "󰪡", fg = "#6f859e" },
    { equals = "󰪢", fg = "#6c8bab" },
    { equals = "󰪣", fg = "#6793bb" },
    { equals = "󰪤", fg = "#619bcf" },
    { equals = "󰪥", fg = "#57a5e5" },
    { equals = "󰜗", fg = "#57a5e5", bold = true },
  ] }],
]

[ui.toast]
# In-terminal toast in bottom-right corner
delivery = "herdr"

[keys]
prefix = "ctrl+a"

# Fuzzy picker for workspaces, tabs, and panes
goto = "alt+s"

# Sidebar with workspace and agent list
toggle_sidebar = "f1"

# Navigation mode (aka "workspace picker")
workspace_picker = "prefix+n"
navigate_pane_left = "h"
navigate_pane_down = "t"
navigate_pane_up = "c"
navigate_pane_right = "n"
navigate_workspace_up = "alt+c"
navigate_workspace_down = "alt+t"

# -----------#
# Workspaces #
# -----------#

rename_workspace = "prefix+>"

# -----#
# Tabs #
# -----#

previous_tab = "alt+g"
next_tab = "alt+r"
move_tab_previous = "alt+shift+g"
move_tab_next = "alt+shift+r"

new_tab = "prefix+w"
rename_tab = "prefix+,"

zoom = "alt+enter"

split_horizontal = "alt+'"
split_vertical = "alt+,"

# ------#
# Panes #
# ------#

# We do not use built-in herdr pane navigation because it does not integrate with Neovim
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""

# ------ #
# Agents #
# ------ #

focus_agent = "alt+1..9"
previous_agent = "alt+f"
next_agent = "alt+l"

# Instead, we shell out to a custom script
[[keys.command]]
key = "alt+h"
type = "shell"
command = "herdr-navigate left alt+h"
description = "focus pane left"

[[keys.command]]
key = "alt+t"
type = "shell"
command = "herdr-navigate down alt+t"
description = "focus pane down"

[[keys.command]]
key = "alt+c"
type = "shell"
command = "herdr-navigate up alt+c"
description = "focus pane up"

[[keys.command]]
key = "alt+n"
type = "shell"
command = "herdr-navigate right alt+n"
description = "focus pane right"

[[keys.command]]
key = "prefix+y"
type = "shell"
command = "herdr-copy line"
description = "copy command line"

[[keys.command]]
key = "prefix+shift+y"
type = "shell"
command = "herdr-copy cwd"
description = "copy current directory"
